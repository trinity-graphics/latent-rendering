<?xml version='1.0' encoding='utf-8'?>
<!-- Four latent channels per VAE in a 2x2 block, from the reference view
     (views/latent_sample_0.exr).  Same cbox scene, full method, no ablation.
     Tiles inside a model's block touch; a 0.6 mm gutter separates the models, so
     each block reads as one group.
     The ch{N} in each href is only a placeholder: figure_latent._VAE_CHANNELS
     picks the four channels per model in reading order (top-left, top-right,
     bottom-left, bottom-right), because the three latent spaces are not
     aligned - FLUX.2 has 32 channels, FLUX.1 and Qwen 16.  Each label-* tspan
     is filled in with its tile's channel number by the script; corner
     box/label style copied from latent_analysis.svg. -->
